        const localOriginRegex = /^http:\/\/(localhost|127\.0\.0\.1):[0-9]{4}$/;

        let pageOrigin = window.location.origin;
        let favIcon = document.createElement("link")
        favIcon.type = "image/svg";
        favIcon.rel = "icon";

        //determine wich icon to show
        if (localOriginRegex.test(pageOrigin)) {
            favIcon.href = "src/resources/navigation/iconComputer.svg";
        }
        else if (pageOrigin === "https://dev.simplipfy.org"){
            favIcon.href = "src/resources/navigation/iconHammer.svg";
        }
        else{
            favIcon.href = "src/resources/navigation/icon.svg"
        }
        document.getElementsByTagName("head")[0].appendChild(favIcon);
    </script>
